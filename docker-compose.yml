services:
  postgres:
    image: postgres:15
    container_name: vote_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vote_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vote_redis
    restart: always
    ports:
      - "127.0.0.1:6378:6379"
    networks:
      - vote_network

volumes:
  postgres_data:

networks:
  vote_network:
    driver: bridge